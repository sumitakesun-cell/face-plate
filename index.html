<style>
  :root{
    --bg:#f4f2ee; --panel:#ffffff; --ink:#1d1d1b; --sub:#6b6862; --line:#e2ded6;
    --accent:#c2410c; --accent-ink:#fff; --stage:#2a2926;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171614; --panel:#22211e; --ink:#f2efe9; --sub:#a39e94; --line:#36342f; --stage:#0e0d0c; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:14px}
  .app{display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto 1fr auto;height:100%;}
  header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
  header .hint{color:var(--sub);font-size:12px}
  .stageWrap{position:relative;background:var(--stage);overflow:hidden;touch-action:none;min-height:300px}
  canvas#stage{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
  canvas#stage.drag{cursor:grabbing}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#d9d4ca;text-align:center;padding:24px}
  .empty.hidden{display:none}
  .empty .big{font-size:17px;font-weight:700}
  .empty small{color:#9b968c}
  .stageWrap.over::after{content:"ここにドロップ";position:absolute;inset:12px;border:2px dashed #f59e0b;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fde68a;font-size:18px;font-weight:700;background:rgba(0,0,0,.35)}
  aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
  .sec h2{font-size:12px;color:var(--sub);font-weight:700;margin:0 0 8px;letter-spacing:.05em}
  label.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
  select,input[type=number],input[type=color]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  input[type=number]{width:74px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:7px 0;font:inherit;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .btn{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
  .btn:hover{border-color:var(--sub)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .btn:disabled{opacity:.45;cursor:default}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btns .btn{flex:1}
  .muted{color:var(--sub);font-size:12px;line-height:1.5}
  footer{grid-column:1/3;border-top:1px solid var(--line);background:var(--panel);padding:8px 10px;display:flex;gap:8px;overflow-x:auto;align-items:center;min-height:76px}
  .thumb{position:relative;flex:none;width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#000}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.on{border-color:var(--accent)}
  .thumb .x{position:absolute;top:1px;right:1px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer}
  .thumb .nm{position:absolute;left:0;right:0;top:0;background:rgba(0,0,0,.55);color:#fff;font-size:9px;line-height:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
  .fnPreview{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;word-break:break-all}
  input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:150px}
  .thumb .done{position:absolute;left:2px;bottom:2px;background:#16a34a;color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
  .addThumb{flex:none;width:56px;height:56px;border-radius:8px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:22px;cursor:pointer;background:transparent}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:.95}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border-radius:14px;padding:16px;max-width:420px;width:100%;text-align:center}
  .modal img{max-width:100%;max-height:60vh;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:6px}
  .zoomRow{display:flex;align-items:center;gap:8px}
  .zoomRow .btn{padding:4px 10px}
  header{padding-top:max(10px, env(safe-area-inset-top))}
  header, footer, aside{padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right))}
  body{-webkit-tap-highlight-color:transparent; touch-action:manipulation}
  .shareBox .btn{width:100%;margin-top:8px}
  @media (max-width:760px){
    html,body{height:auto}
    .app{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto minmax(320px,58vh) auto auto}
    aside{padding-bottom:max(20px, env(safe-area-inset-bottom))}
    input[type=text],input[type=number],select{font-size:16px}  /* stops iPhone from zooming in on focus */
    header{grid-column:1}
    header .hint{display:none}
    aside{border-left:0;border-top:1px solid var(--line);order:3}
    footer{grid-column:1;order:2}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>顔プレート トリミング</h1>
    <span class="hint">ドラッグで移動 ・ ホイール／ピンチで拡大縮小 ・ ←↑→↓ と +／− でも調整</span>
  </header>

  <div class="stageWrap" id="stageWrap">
    <canvas id="stage"></canvas>
    <div class="empty" id="empty">
      <div class="big">写真を取り込んでください</div>
      <button class="btn primary" id="pickBtn">写真を選ぶ</button>
      <small>ドラッグ＆ドロップ、貼り付け（Ctrl/⌘+V）、複数枚まとめてもOK</small>
    </div>
  </div>

  <aside>
    <div class="sec">
      <h2>プレートのサイズ</h2>
      <label class="row">プリセット
        <select id="preset">
          <option value="30x40">30×40mm（3:4）</option>
          <option value="24x30">24×30mm（4:5）</option>
          <option value="35x45">35×45mm（証明写真）</option>
          <option value="40x40" selected>40×40mm（正方形）</option>
          <option value="44x44c">Ø44mm 円形</option>
          <option value="57x57c">Ø57mm 円形</option>
          <option value="custom">カスタム</option>
        </select>
      </label>
      <label class="row">幅 (mm)<input type="number" id="wmm" min="5" max="500" step="1" value="40"></label>
      <label class="row">高さ (mm)<input type="number" id="hmm" min="5" max="500" step="1" value="40"></label>
      <label class="row">解像度 (dpi)
        <select id="dpi"><option>150</option><option>200</option><option selected>300</option><option>350</option><option>600</option></select>
      </label>
      <div class="muted" id="pxInfo"></div>
    </div>

    <div class="sec">
      <h2>写す範囲</h2>
      <div class="seg" id="cropSeg">
        <button data-v="neck" class="on">首から上</button>
        <button data-v="shoulder">肩から上</button>
      </div>
    </div>

    <div class="sec">
      <h2>形</h2>
      <div class="seg" id="shapeSeg">
        <button data-v="rect" class="on">四角</button>
        <button data-v="round">角丸</button>
        <button data-v="circle">円</button>
      </div>
    </div>

    <div class="sec">
      <h2>位置あわせ</h2>
      <div class="btns" style="margin-bottom:8px">
        <button class="btn" id="autoBtn" title="顔を検出して、選んだ範囲が収まるように自動配置">顔を自動検出</button>
        <button class="btn" id="resetBtn">全体表示に戻す</button>
      </div>
      <div class="muted" id="autoNote" style="margin-bottom:8px"></div>
      <div class="muted" style="margin-bottom:4px">拡大</div>
      <div class="zoomRow">
        <button class="btn" id="zOut">−</button>
        <input type="range" id="zoom" min="0" max="1000" value="0">
        <button class="btn" id="zIn">＋</button>
      </div>
      <div class="muted" style="margin:10px 0 4px">傾き補正 <span id="rotVal">0°</span></div>
      <input type="range" id="rot" min="-20" max="20" step="0.5" value="0">
      <label class="row" style="margin-top:10px">ガイド線を表示<input type="checkbox" id="guides" checked></label>
      <div class="muted"><span id="guideNote">ガイド：上の線＝頭のてっぺん、楕円＝頭と顔、下の2本＝首。</span></div>
    </div>

    <div class="sec">
      <h2>ファイル名</h2>
      <label class="row">人物名<input type="text" id="person" placeholder="例：山田太郎" disabled></label>
      <label class="row">年<input type="number" id="year" min="1900" max="2100" step="1" disabled></label>
      <div class="muted" id="yearNote" style="margin-bottom:6px"></div>
      <div class="fnPreview" id="fnPreview">—</div>
      <div class="muted" style="margin-top:6px">名前を入れて Return キーを押すと、次の写真に進みます。</div>
    </div>

    <div class="sec">
      <h2>書き出し</h2>
      <label class="row">形式
        <select id="fmt"><option value="png">PNG</option><option value="jpg">JPEG</option></select>
      </label>
      <label class="row">余白・背景色<input type="color" id="bg" value="#ffffff"></label>
      <div class="btns" style="margin-top:8px">
        <button class="btn primary" id="saveBtn" disabled>この写真を保存</button>
      </div>
      <div class="btns" style="margin-top:8px">
        <button class="btn" id="saveAllBtn" disabled>全部まとめて保存（ZIP）</button>
      </div>
      <div class="muted" id="saveNote" style="margin-top:8px"></div>
    </div>
  </aside>

  <footer id="strip">
    <button class="addThumb" id="addBtn" title="写真を追加">＋</button>
  </footer>
</div>

<input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>
<div class="toast" id="toast"></div>
<div class="modal" id="shareModal"><div class="box shareBox">
  <p id="shareMsg" style="margin:4px 0 8px;font-weight:700"></p>
  <button class="btn primary" id="shareGo">写真・ファイルに保存…</button>
  <button class="btn" id="shareCancel">やめる</button>
  <p class="muted" style="margin-top:10px">「画像を保存」で写真アプリへ、「"ファイル"に保存」でファイル名（年-名前）つきで保存できます。</p>
</div></div>
<div class="modal" id="modal"><div class="box">
  <img id="modalImg" alt="書き出した画像">
  <p class="muted">画像を長押し、または右クリックで保存してください。</p>
  <button class="btn" id="modalClose">閉じる</button>
</div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), ctx = stage.getContext('2d'), wrap = $('stageWrap');
  const items = []; // {name, img, url, st:{zoom,ox,oy,rot}, done}
  let cur = -1;
  let shape = 'rect';
  let cropMode = 'neck';
  // where the head sits in the plate (fractions of plate height)

    if (document.activeElement !== $('year')) $('year').value = it.year;
    $('yearNote').textContent =
      it.yearSrc === 'meta' ? '年：写真の撮影日から' :
      it.yearSrc === 'odd'  ? `年：撮影日が ${it.yearRaw} 年になっていたため、今年にしました` :
      it.yearSrc === 'edit' ? '年：手入力' : '年：撮影日の情報がないため、今年にしました';
    $('fnPreview').textContent = fname(it);
  }
  $('person').addEventListener('input', e => { const it = items[cur]; if (!it) return; it.person = e.target.value; it.done = false; showName(); renderStrip(); });
  $('person').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); if (cur < items.length - 1){ select(cur + 1); $('person').focus(); $('person').select(); } else $('person').blur(); }
  });
  $('year').addEventListener('input', e => { const it = items[cur]; if (!it) return; const y = parseInt(e.target.value, 10); if (y > 1900 && y < 2200){ it.year = y; it.yearSrc = 'edit'; } showName(); });
  $('fmt').addEventListener('change', () => showName());
  function renderStrip(){
    const strip = $('strip'); [...strip.querySelectorAll('.thumb')].forEach(n => n.remove());
    items.forEach((it, i) => {
      const d = document.createElement('div'); d.className = 'thumb' + (i === cur ? ' on' : '');
      d.innerHTML = `<img alt="">${it.person ? '<span class="nm"></span>' : ''}<button class="x" title="削除">✕</button>${it.done ? '<span class="done">保存済</span>' : ''}`;
      if (it.person) d.querySelector('.nm').textContent = it.person;
      d.title = fname(it);
      d.querySelector('img').src = it.url;
      d.onclick = e => { if (e.target.classList.contains('x')){ URL.revokeObjectURL(it.url); items.splice(i, 1); select(Math.min(cur, items.length - 1)); } else select(i); };
      strip.insertBefore(d, $('addBtn'));
    });
    $('saveAllBtn').disabled = items.length < 1;
  }

  // ---------- export ----------
  function render(it){
    const o = outSize(), c = document.createElement('canvas'); c.width = o.w; c.height = o.h;
    const x = c.getContext('2d'), jpg = $('fmt').value === 'jpg';
    if (jpg || shape === 'rect'){ x.fillStyle = $('bg').value; x.fillRect(0, 0, o.w, o.h); }
    x.save(); shapePath(x, 0, 0, o.w, o.h); x.clip();
    x.fillStyle = $('bg').value; x.fillRect(0, 0, o.w, o.h);
    drawImageTo(x, it, 0, 0, o.w);
    x.restore();
    return new Promise(res => c.toBlob(res, jpg ? 'image/jpeg' : 'image/png', 0.95));
  }
  const ext = () => $('fmt').value === 'jpg' ? 'jpg' : 'png';
  const safe = t => String(t).replace(/[\/\\:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim();
  const baseName = it => { const p = safe(it.person); return p ? `${it.year}-${p}` : `${it.year}-${safe(it.name) || 'photo'}`; };
  const fname = it => `${baseName(it)}.${ext()}`;

  // ---------- iPhone / iPad / Android: share sheet ("画像を保存" / "ファイルに保存") ----------
  const isMobileShare = () => !native && !inClaude() && !!navigator.canShare &&
    (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
  const mimeOf = n => /\.jpe?g$/i.test(n) ? 'image/jpeg' : /\.zip$/i.test(n) ? 'application/zip' : 'image/png';
  function shareViaButton(files){
    return new Promise(res => {
      $('shareMsg').textContent = files.length > 1 ? `${files.length}枚の画像ができました` : `「${files[0].name}」ができました`;
      $('shareModal').classList.add('show');
      $('shareGo').onclick = async () => {
        $('shareModal').classList.remove('show');
        try { await navigator.share({files}); res(true); } catch (e) { res(e.name === 'AbortError' ? false : null); }
      };
      $('shareCancel').onclick = () => { $('shareModal').classList.remove('show'); res(false); };
    });
  }
  // returns true (shared), false (cancelled) or null (sharing not possible here)
  async function shareFiles(files, direct){
    try { if (!navigator.canShare({files})) return null; } catch (e) { return null; }
    if (!direct) return shareViaButton(files);
    try { await navigator.share({files}); return true; }
    catch (e) {
      if (e.name === 'AbortError') return false;
      if (e.name === 'NotAllowedError') return shareViaButton(files); // tap expired while rendering: ask for one more tap
      return null;
    }
  }

  async function offer(filename, blob){
    if (isMobileShare()){
      const r = await shareFiles([new File([blob], filename, {type: mimeOf(filename)})], true);
      if (r === true){ toast('保存しました'); return true; }
      if (r === false){ toast('保存をキャンセルしました'); return false; }
    }
    if (native){
      const r = await callNative('save', {name: filename, b64: await blobToB64(blob)});
      toast(r && r.ok ? '保存しました' : '保存をキャンセルしました'); return !!(r && r.ok);
    }
    if (!window.claude && window.showSaveFilePicker){ // Edge / Chrome desktop: real "save as" dialog
      try {
        const e2 = filename.split('.').pop().toLowerCase();
        const mime = e2 === 'zip' ? 'application/zip' : e2 === 'jpg' ? 'image/jpeg' : 'image/png';
        const h = await window.showSaveFilePicker({suggestedName: filename, id: 'faceplate-out',
          types: [{description: e2 === 'zip' ? 'ZIP ファイル' : '画像', accept: {[mime]: ['.' + e2]}}]});
        const w = await h.createWritable(); await w.write(blob); await w.close();
        toast('保存しました'); return true;
      } catch (e) { if (e.name === 'AbortError') { toast('保存をキャンセルしました'); return false; } /* else fall back to download */ }
    }
    if (!window.claude){ // plain browser: normal download
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      return true;
    }
    if (downloads){
      try{ await downloads.save({filename, data: blob}); toast('保存しました'); return true; }
      catch(err){ if (err && err.code === 'declined') { toast('保存をキャンセルしました'); return false; } if (err && err.code === 'rate_limited'){ toast('少し待ってからもう一度お試しください'); return false; } }
    }
    if (blob.type.startsWith('image/')){
      $('modalImg').src = URL.createObjectURL(blob); $('modal').classList.add('show'); return true;
    }
    toast('この表示では ZIP を保存できません。1枚ずつ保存してください'); return false;
  }
  $('modalClose').onclick = () => $('modal').classList.remove('show');

  $('saveBtn').onclick = async () => {
    const it = items[cur]; if (!it) return;
    const blob = await render(it);
    if (await offer(fname(it), blob)){ it.done = true; renderStrip(); }
  };
  $('saveAllBtn').onclick = async () => {
    if (!items.length) return;
    // Desktop browser (Windows app / Edge / Chrome): pick a folder first (needs the click's user activation)
    if (isMobileShare()){
      $('saveAllBtn').disabled = true; toast('書き出し中…');
      const list = [], used = new Set();
      for (const it of items){
        let n = fname(it), k = 2; while (used.has(n)) n = `${baseName(it)}_${k++}.${ext()}`; used.add(n);
        list.push(new File([await render(it)], n, {type: mimeOf(n)}));
      }
      $('saveAllBtn').disabled = false;
      const r = await shareFiles(list, false);
      if (r === true){ items.forEach(it => it.done = true); renderStrip(); toast('保存しました'); return; }
      if (r === false){ toast('保存をキャンセルしました'); return; }
      // sharing unavailable: fall through to ZIP download
    }
    if (!native && !window.claude && window.showDirectoryPicker){
      let dir;
      try { dir = await window.showDirectoryPicker({mode: 'readwrite', id: 'faceplate-out'}); }
      catch (e) { if (e.name === 'AbortError') { toast('保存をキャンセルしました'); return; } dir = null; }
      if (dir){
        $('saveAllBtn').disabled = true; toast('書き出し中…');
        const exists = async n => { try { await dir.getFileHandle(n); return true; } catch (e) { return false; } };
        let count = 0;
        try {
          for (const it of items){
            let n = fname(it), k = 2; while (await exists(n)) n = `${baseName(it)}_${k++}.${ext()}`;
            const w = await (await dir.getFileHandle(n, {create: true})).createWritable();
            await w.write(await render(it)); await w.close(); it.done = true; count++;
          }
          toast(`${count}枚をフォルダに保存しました`);
        } catch (e) { toast('保存中にエラーが起きました：' + e.message); }
        renderStrip(); $('saveAllBtn').disabled = false; return;
      }
    }
    $('saveAllBtn').disabled = true; toast('書き出し中…');
    const files = [], used = new Set();
    for (const it of items){
      let n = fname(it), k = 2; while (used.has(n)) n = `${baseName(it)}_${k++}.${ext()}`; used.add(n);
      const blob = await render(it);
      files.push(native ? {name:n, b64: await blobToB64(blob)} : {name:n, data:new Uint8Array(await blob.arrayBuffer())});
    }
    let ok;
    if (native){
      const r = await callNative('saveMany', {files});
      ok = !!(r && r.ok); toast(ok ? `${r.count}枚をフォルダに保存しました` : '保存をキャンセルしました');
    } else ok = await offer(`face_plates_${files.length}枚.zip`, makeZip(files));
    if (ok) { items.forEach(it => it.done = true); renderStrip(); }
    $('saveAllBtn').disabled = false;
  };

  // minimal ZIP (store, no compression)
  const crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = crcT[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function makeZip(files){
    const enc = new TextEncoder(), parts = [], central = []; let off = 0;
    const now = new Date(), dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)), dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate());
    for (const f of files){
      const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true);
      h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      parts.push(h, nm, f.data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true);
      c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
      central.push(c, nm);
      off += 30 + nm.length + sz;
    }
    const cs = central.reduce((a, p) => a + p.byteLength, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cs, true); e.setUint32(16, off, true);
    return new Blob([...parts, ...central, e], {type:'application/zip'});
  }

  let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

  updatePxInfo(); select(-1);
  if ('serviceWorker' in navigator && /\.github\.io$/i.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if (isMobileShare()) $('saveAllBtn').textContent = '全部まとめて保存';
  if (isMobileShare()) $('saveBtn').textContent = 'この写真を保存';
  if (native || (!window.claude && window.showDirectoryPicker)) $('saveAllBtn').textContent = '全部まとめて保存（フォルダを選ぶ）';
  if (window.claude && claude.use){
    claude.use('downloads').then(d => { downloads = d; if (!d) $('saveNote').textContent = 'この表示では直接保存できないため、書き出した画像を長押し／右クリックで保存します。'; }).catch(() => {});
  }
})();
</script>
</body>
</html>
